<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1763d4"><title>南山进场路线</title><link rel="stylesheet" href="./style.css"></head>
<body>
<header><div class="title"><div><span class="eyebrow">机组班车 · 进场</span><h1>南山路线地图</h1></div><span id="map-state" role="status">地图加载中</span></div><nav aria-label="选择进场路线"><button data-route="all" aria-pressed="true">全部</button><button data-route="A" aria-pressed="false"><i class="a"></i>A 线</button><button data-route="B" aria-pressed="false"><i class="b"></i>B 线</button><button data-route="S" aria-pressed="false"><i class="s"></i>蛇口摆渡</button></nav></header>
<main>
<section class="map-wrap" aria-label="交互地图">
<div id="map" aria-label="可拖动及缩放的高德地图"></div>
<div class="range"><button id="south" aria-pressed="true">南山站点</button><button id="whole" aria-pressed="false">全程</button></div>
<div class="map-tools"><button id="zoom-in" aria-label="放大地图">＋</button><button id="zoom-out" aria-label="缩小地图">−</button><button id="fit">重置<br>视野</button></div>
<div class="map-note">虚线为顺序示意 · 非导航轨迹</div>
<div id="error" role="alert" hidden><strong>地图暂时无法加载</strong><p id="error-message"></p><button id="retry">重新加载</button></div>
</section>
<aside aria-label="路线站点"><div class="panel-head"><div><h2 id="route-title">全部进场路线</h2><p id="route-summary">A/B 在飞行员公寓汇合，摆渡线接驳至此</p></div></div><div id="station-detail" aria-live="polite" hidden></div><div id="station-list"></div><details><summary>点位精度与来源 · 9月17日核对</summary><p>已按高德搜索结果核对地点，点击站点可查看高德原始地点。带 * 表示班车具体门口、路口或停靠位置仍待确认；公交站匹配不代表已确认站台方向。</p><p>“南山文化中心”和“后海立交”未找到可确定的同名地点，保留估算位置并注明。终点按你确认的“深圳航空公司东区运行信息楼”标注。</p><p>坐标使用高德 GCJ-02。站点顺序来自原图；虚线只表示先后关系，未核实逐路口行车轨迹。</p></details></aside>
</main><script src="./config.js"></script><script src="./data.js"></script><script src="./app.js"></script></body></html>
